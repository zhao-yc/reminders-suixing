<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>随行合成验证</title></head><body>
<div role="tree" aria-label="提醒事项列表">
  <div role="treeitem" class="rm-list-menu-item" aria-selected="true" data-list="one"><button class="inline-editable-label">验证清单</button></div>
  <div role="treeitem" class="rm-list-menu-item" aria-selected="false" data-list="two"><button class="inline-editable-label">验证清单</button></div>
</div>
<div role="treegrid" aria-label="提醒列表"></div>
<script>
// 该页面只包含合成数据，用来验证重复标题、完成回执和列表切换，绝不访问 Apple。
window.fixtureClicks = 0;
window.fixtureDisableUpdates = false;
window.fixtureRequiresPointerDown = false;
window.fixturePointerDown = false;
window.fixtureTextSaves = 0;
window.fixtureTextInputs = 0;
window.fixtureTextBlurs = 0;
window.fixtureTextPreparations = 0;
// JSDOM 不实现浏览器编辑命令；真实 Electron 保留并验证其原生实现。
if (!document.execCommand) document.execCommand = function (command, _ui, value) {
  if (!['insertText', 'insertHTML'].includes(command) || !document.activeElement?.isContentEditable && document.activeElement?.getAttribute('contenteditable') !== 'true') return false;
  if (command === 'insertHTML') document.activeElement.innerHTML = value;
  else document.activeElement.textContent = value;
  document.activeElement.dispatchEvent(new InputEvent('input', { bubbles: true, data: value, inputType: 'insertText' }));
  return true;
};
function renderFixture(list) {
  const complete = sessionStorage.getItem('fixture-complete') === 'true';
  const titles = list === 'two' ? ['随行验证 · 第二个同名清单'] : ['随行验证 · 同名事项', '随行验证 · 同名事项'];
  document.querySelector('[role="treegrid"]').innerHTML = titles.map((title, index) =>
    '<div class="reminder-item" id="reminder-item-fixture-' + list + '-' + index + '" role="row" aria-level="1" aria-setsize="' + titles.length + '">' +
    '<button class="mark-completed" data-completed="' + (index === 0 && complete) + '" aria-label="切换完成状态"></button>' +
    '<div class="title"><div role="textbox" contenteditable="true">' + title + '</div></div>' +
    '<div class="notes"><div role="textbox" contenteditable="true"></div></div><div class="metadata">2026/11/04<span aria-hidden="true">重复无障碍文字</span></div></div>'
  ).join('');
  document.querySelectorAll('.title [role="textbox"], .notes [role="textbox"]').forEach(editor => {
    const field = editor.closest('.title') ? 'title' : 'notes';
    const key = 'fixture-text-' + editor.closest('.reminder-item').id + '-' + field;
    const saved = sessionStorage.getItem(key);
    if (saved !== null) editor.textContent = saved;
    let changed = false;
    let prepared = false;
    editor.addEventListener('beforeinput', () => { prepared = true; window.fixtureTextPreparations++; });
    editor.addEventListener('input', () => {
      if (!prepared) throw new Error('合成富文本编辑必须先准备输入范围');
      prepared = false; changed = true; window.fixtureTextInputs++;
    });
    editor.addEventListener('blur', () => {
      window.fixtureTextBlurs++;
      if (!changed) return;
      window.fixtureTextSaves++;
      sessionStorage.setItem(key, editor.innerText ?? editor.innerHTML.replace(/<br\s*\/?\s*>/gi, '\n').replace(/<[^>]*>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&'));
      changed = false;
    });
  });
  document.querySelectorAll('.mark-completed').forEach(button => {
    button.addEventListener('mousedown', () => { window.fixturePointerDown = true; });
    button.addEventListener('click', () => {
    if (window.fixtureRequiresPointerDown && !window.fixturePointerDown) return;
    window.fixturePointerDown = false;
    window.fixtureClicks++;
    if (window.fixtureDisableUpdates) return;
    const next = button.dataset.completed !== 'true';
    button.dataset.completed = String(next);
    sessionStorage.setItem('fixture-complete', String(next));
  }); });
}
document.querySelectorAll('[role="treeitem"]').forEach(node => node.addEventListener('click', () => {
  document.querySelectorAll('[role="treeitem"]').forEach(other => other.setAttribute('aria-selected', String(other === node)));
  renderFixture(node.dataset.list);
}));
renderFixture('one');
</script></body></html>
